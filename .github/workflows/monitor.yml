name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run monitor
        run: |
          ls -la

          MONITOR=$(ls Production_Monitor_ReqRes*.json 2>/dev/null | head -n 1)
          echo "Monitor collection: $MONITOR"

          if [ -z "$MONITOR" ]; then
            echo "Khong tim thay file Production_Monitor_ReqRes*.json"
            exit 1
          fi

          newman run "$MONITOR" \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "api_key=${{ secrets.REQRES_API_KEY }}"
